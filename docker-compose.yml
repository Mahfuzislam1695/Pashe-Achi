# Optional: a development PostgreSQL if you don't have one installed locally.
#   docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pashe
      POSTGRES_PASSWORD: pashe
      POSTGRES_DB: pashe_achi
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
