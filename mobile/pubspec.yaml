name: kingfisher
description: "Kingfisher: fresh market, house shifting, emergency medicine and parcel delivery."
# The customer app for Android and iPhone (application id com.kingfisherbd24.app). It talks to the
# same API as the website (https://kingfisherbd24.com/api/v1). See README.md.
publish_to: 'none'

# versionName+versionCode. Raise the number after + for every APK or Play upload.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Exact versions, like the server's package.json; pubspec.lock pins the rest.
dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.8.0
  cupertino_icons: 1.0.8
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  shared_preferences: 2.5.6
  socket_io_client: 3.1.6
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter_local_notifications: 22.3.3
  flutter_map: 8.3.2
  latlong2: 0.10.1
  geolocator: 14.1.2
  image_picker: 1.2.4
  file_picker: 13.3.0
  url_launcher: 6.3.3
  cached_network_image: 4.0.5
  share_plus: 13.3.1
  package_info_plus: 10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  image: 4.12.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/

  # The website's fonts: Inter for Latin text, Hind Siliguri for Bangla (both SIL Open Font License,
  # licence files beside them).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # The website's icons (Lucide, ISC licence beside it); release builds keep only the glyphs used.
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

# App icons (dart run flutter_launcher_icons), made from the website's logo by tool/make_icons.dart.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon-ios.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  adaptive_icon_monochrome: assets/icon/icon-monochrome.png
  min_sdk_android: 24

# The launch screen (dart run flutter_native_splash:create): the logo on white.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/splash-android12.png
  ios: true
  android: true
  web: false
